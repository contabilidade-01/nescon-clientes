services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: rhapp
      POSTGRES_USER: rhapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhapp -d rhapp"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Alinha a palavra-passe do utilizador rhapp no volume antigo com DB_PASSWORD do Easypanel.
  # Partilha rede com postgres e liga a 127.0.0.1 (trust na imagem oficial) — sem apagar pgdata.
  db-password-fix:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: "service:postgres"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for i in $$(seq 1 30); do
          psql -h 127.0.0.1 -U rhapp -d rhapp -c "SELECT 1" >/dev/null 2>&1 && break
          sleep 1
        done
        psql -h 127.0.0.1 -U rhapp -d rhapp -v ON_ERROR_STOP=1 \
          -c "ALTER USER rhapp WITH PASSWORD '$$POSTGRES_PASSWORD'"

  api:
    build: ./api
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rhapp
      DB_USER: rhapp
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      # SEM PADRAO, de proposito: a API recusa arrancar com segredo de exemplo ou
      # curto demais. Um sistema que nao sobe e um chamado de dez minutos; um que sobe
      # com o segredo publico e uma invasao que ninguem percebe.
      # Gerar com: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (openssl rand -hex 32)}
      PORT: 3001
      UPLOAD_DIR: /app/uploads
      # Chave de serviço partilhada com o sistema de guias (release, sync-companies, access-stats).
      # Vazia = rotas /api/fiscal/* desligadas.
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      # Credenciais da API do G-Click: o portal puxa os documentos direto de lá.
      # São as MESMAS do sistema de guias. Sem elas, o portal fica sem os documentos.
      GCLICK_CLIENT_ID: ${GCLICK_CLIENT_ID:-}
      GCLICK_CLIENT_SECRET: ${GCLICK_CLIENT_SECRET:-}
      # Quantos meses de histórico puxar e de quanto em quanto tempo (0 = só manual).
      GCLICK_SYNC_MESES: ${GCLICK_SYNC_MESES:-6}
      GCLICK_SYNC_INTERVAL_H: ${GCLICK_SYNC_INTERVAL_H:-6}
      # 1ª carga automática ao subir (só se o portal ainda estiver vazio). "false" desliga.
      GCLICK_SYNC_ON_BOOT: ${GCLICK_SYNC_ON_BOOT:-true}
      # Alertas de vencimento pelo WhatsApp (uazapi) — mesmas credenciais do G-Click.
      UAZAPI_SUBDOMAIN: ${UAZAPI_SUBDOMAIN:-}
      UAZAPI_TOKEN: ${UAZAPI_TOKEN:-}
      # Ligar o envio automático, a hora e o CNPJ do escritório NÃO são variáveis: são
      # decisões do dia a dia e ficam na tela (Alertas → Configuração, em app_settings).
      # Ambiente é para o que o app precisa saber antes de existir — senha, token, URL.
      # Quem recebe o alerta também é escolha da tela: a previsão tem seleção por
      # empresa, que foi o que substituiu a antiga lista branca por CNPJ.
      #
      # Anti-bloqueio do número (padrões vindos do sistema de guias).
      ALERTAS_THROTTLE_S: ${ALERTAS_THROTTLE_S:-0.6}
      ALERTAS_MAX_POR_HORA: ${ALERTAS_MAX_POR_HORA:-180}
      ALERTAS_DELAY_MS: ${ALERTAS_DELAY_MS:-1200}
      GCLICK_ALERTA_SO_ATIVOS: ${GCLICK_ALERTA_SO_ATIVOS:-true}
      # CNPJ do escritório: a fonte agora é a tela. Isto fica só como plano B para
      # instalação que já tinha a variável configurada antes da tela existir.
      ESCRITORIO_CNPJ: ${ESCRITORIO_CNPJ:-}
      # Fallback de IA na leitura do PDF. Sem chave, a opção nem pode ser ligada na tela.
      LOVABLE_API_KEY: ${LOVABLE_API_KEY:-}
      IA_PDF_BASE_URL: ${IA_PDF_BASE_URL:-}
      IA_PDF_MODELO: ${IA_PDF_MODELO:-}
      # Senha que cifra o backup diário do banco. GUARDE-A FORA DO SERVIDOR: sem ela o
      # arquivo é inútil, e o dia de precisar dele é o dia em que o servidor sumiu.
      BACKUP_SENHA: ${BACKUP_SENHA:-}
      # Varredura de arquivos órfãos no volume de uploads.
      UPLOADS_TTL_HORAS: ${UPLOADS_TTL_HORAS:-48}
      UPLOADS_LIMPEZA_INTERVALO_H: ${UPLOADS_LIMPEZA_INTERVALO_H:-12}
      # Recuperação de senha: URL pública do front (HTTPS em produção, sem / no fim)
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      db-password-fix:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  # Nome "web" (não "frontend"): o Easypanel rejeita serviço "frontend" no merge com
  # docker-compose.override.yml ("Additional property frontend is not allowed").
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: always
    # Não publicar 80 no host: evita conflito com o proxy do Easypanel. No domínio,
    # usar Serviço Compose: web, porta 80.
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
