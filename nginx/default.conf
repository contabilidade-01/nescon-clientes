server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Não anunciar a versão do nginx: informação de graça para quem procura alvo.
    server_tokens off;

    # ---------------------------------------------------------------------------
    # Cabeçalhos de segurança.
    #
    # `always` é obrigatório: sem ele o nginx omite o cabeçalho nas respostas de erro
    # (4xx/5xx) — justamente as que um ataque costuma provocar.
    #
    # Ficam AQUI e não na API porque é o nginx que entrega o HTML. O helmet na API cobre
    # as respostas dela; a página é servida daqui.
    # ---------------------------------------------------------------------------

    # O portal nunca deve ser carregado dentro de um iframe: é o que impede clickjacking,
    # em que um site sobrepõe uma página invisível e faz o cliente clicar sem saber.
    add_header X-Frame-Options "DENY" always;

    # Impede o navegador de "adivinhar" o tipo do arquivo. Sem isto, um PDF forjado com
    # conteúdo HTML poderia ser executado como página no domínio do portal.
    add_header X-Content-Type-Options "nosniff" always;

    # Não vazar a URL interna (que contém token de entrega) ao clicar para fora.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # O portal não usa câmera, microfone nem localização — desligar é de graça.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # HSTS: força HTTPS nas visitas seguintes. Só faz sentido com certificado válido, que
    # o Easypanel provê. Sem `preload` de propósito — entrar na lista de preload dos
    # navegadores é praticamente irreversível.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP: o app é React compilado, então nada de script externo.
    # `unsafe-inline` em style é necessário para o Tailwind/shadcn, que injeta estilo
    # inline; em script NÃO é permitido, que é o que importa contra XSS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Express backend
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # `add_header` num location SUBSTITUI os do server — repetir os de segurança aqui
        # é obrigatório, senão os arquivos estáticos saem sem nenhum deles.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
