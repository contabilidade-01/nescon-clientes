<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!--
    Cartão "Como acessar o Portal do Cliente".
    Formato retrato 1080x1350: é a proporção que o WhatsApp mostra inteira, sem cortar.
    Feito para ser enviado ao cliente junto com a senha.
  -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111C2E"/>
    </linearGradient>
    <linearGradient id="faixa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12B981"/>
      <stop offset="100%" stop-color="#0EA5A5"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#fundo)"/>
  <rect width="1080" height="10" fill="url(#faixa)"/>

  <!-- Cabeçalho -->
  <text x="72" y="112" fill="#12B981" font-size="26" font-weight="700" letter-spacing="3">NESCON CONTABILIDADE</text>
  <text x="72" y="182" fill="#FFFFFF" font-size="58" font-weight="700">Como acessar o seu</text>
  <text x="72" y="248" fill="#FFFFFF" font-size="58" font-weight="700">Portal do Cliente</text>
  <text x="72" y="302" fill="#94A3B8" font-size="27">Guias, folha de pagamento, documentos e vencimentos</text>
  <text x="72" y="340" fill="#94A3B8" font-size="27">num lugar só — pelo celular ou pelo computador.</text>

  <!-- Passo 1 -->
  <circle cx="100" cy="440" r="30" fill="#12B981"/>
  <text x="100" y="452" fill="#0B1220" font-size="32" font-weight="700" text-anchor="middle">1</text>
  <text x="152" y="432" fill="#FFFFFF" font-size="34" font-weight="600">Abra o portal no navegador</text>
  <rect x="152" y="452" width="700" height="62" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="176" y="492" fill="#7DD3FC" font-size="30" font-family="Consolas, Menlo, monospace">app.gestaoempresa.com</text>

  <!-- Passo 2 -->
  <circle cx="100" cy="606" r="30" fill="#12B981"/>
  <text x="100" y="618" fill="#0B1220" font-size="32" font-weight="700" text-anchor="middle">2</text>
  <text x="152" y="598" fill="#FFFFFF" font-size="34" font-weight="600">No campo Login, digite o CNPJ</text>
  <text x="152" y="640" fill="#94A3B8" font-size="26">da sua empresa — pode ser só os números.</text>
  <rect x="152" y="662" width="440" height="58" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="176" y="700" fill="#E2E8F0" font-size="28" font-family="Consolas, Menlo, monospace">12345678000199</text>

  <!-- Passo 3 -->
  <circle cx="100" cy="812" r="30" fill="#12B981"/>
  <text x="100" y="824" fill="#0B1220" font-size="32" font-weight="700" text-anchor="middle">3</text>
  <text x="152" y="804" fill="#FFFFFF" font-size="34" font-weight="600">No campo Senha, use a que enviamos</text>
  <text x="152" y="846" fill="#94A3B8" font-size="26">São 10 caracteres com um hífen no meio. Exemplo:</text>
  <rect x="152" y="868" width="360" height="58" rx="12" fill="#1E293B" stroke="#12B981" stroke-width="2"/>
  <text x="176" y="906" fill="#12B981" font-size="30" font-weight="700" font-family="Consolas, Menlo, monospace">262HT-mQkRG</text>
  <text x="536" y="906" fill="#64748B" font-size="24">(a sua é diferente)</text>

  <!-- Aviso: maiúsculas e minúsculas -->
  <rect x="72" y="954" width="936" height="98" rx="14" fill="#78350F" fill-opacity="0.35" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="2"/>
  <text x="104" y="996" fill="#FCD34D" font-size="26">A senha diferencia MAIÚSCULAS de minúsculas.</text>
  <text x="104" y="1030" fill="#FCD34D" font-size="26">Digite exatamente como recebeu.</text>

  <!-- Passo 4 -->
  <circle cx="100" cy="1090" r="30" fill="#12B981"/>
  <text x="100" y="1102" fill="#0B1220" font-size="32" font-weight="700" text-anchor="middle">4</text>
  <text x="152" y="1082" fill="#FFFFFF" font-size="34" font-weight="600">Crie a sua senha definitiva</text>
  <text x="152" y="1124" fill="#94A3B8" font-size="26">O portal pede isso logo no primeiro acesso. A senha que</text>
  <text x="152" y="1158" fill="#94A3B8" font-size="26">enviamos deixa de valer, e só você conhece a nova.</text>

  <!-- Rodapé -->
  <line x1="72" y1="1212" x2="1008" y2="1212" stroke="#1E293B" stroke-width="2"/>
  <text x="72" y="1258" fill="#94A3B8" font-size="26">Esqueceu a senha? Toque em</text>
  <text x="418" y="1258" fill="#12B981" font-size="26" font-weight="600">“Esqueci minha senha”</text>
  <text x="720" y="1258" fill="#94A3B8" font-size="26">na tela</text>
  <text x="72" y="1296" fill="#94A3B8" font-size="26">de entrada, ou fale com a gente que enviamos outra.</text>
</svg>
